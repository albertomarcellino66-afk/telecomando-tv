name: Compila APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compila
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rinomina APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TelecomandoTV.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TelecomandoTV
          path: TelecomandoTV.apk

      - name: Pubblica APK nel ramo "apk"
        run: |
          mkdir /tmp/out && cp TelecomandoTV.apk /tmp/out/
          cd /tmp/out
          git init -q -b apk
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add TelecomandoTV.apk
          git commit -qm "APK da ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk
